<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Landing</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f8f9;
    }

    #video-section {
      position: fixed;
      inset: 0;
      background: #f3f8f9;
      opacity: 1;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
    }

    #video-section.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #bg-video {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: auto;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    #landing {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    #landing.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="video-section">
    <video id="bg-video" autoplay muted playsinline>
      <source src="video.mp4" type="video/mp4">
    </video>
  </div>

  <iframe id="landing" src="code.html" title="Landing Page"></iframe>

  <script>
    const video = document.getElementById('bg-video');
    const videoSection = document.getElementById('video-section');
    const landing = document.getElementById('landing');

    function transitionToLanding() {
      videoSection.classList.add('fade-out');
      landing.classList.add('visible');
    }

    video.addEventListener('ended', transitionToLanding);

    // If video fails to load, skip straight to landing
    video.addEventListener('error', transitionToLanding);
  </script>

</body>
</html>
